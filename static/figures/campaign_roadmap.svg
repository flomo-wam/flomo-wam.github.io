<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="rm-title rm-desc">
  <title id="rm-title">Remaining campaign roadmaps: RoboTwin scaling (with exploration) and RoboDojo, parallel and sequential stages</title>
  <desc id="rm-desc">RoboTwin timing rows retain the September13 21:30UTC snapshot and conditional estimates. RoboDojo rows show September14 status, not time-scaled estimates:875 tracks/VAE and35 loader gates accepted; Fast-WAM production protected onabc6; MA/ pi0.5 admissions onabc8/abc5, eight GPUs each, before5000-update production. Evaluation is60cells and2100rollouts across MA/pi0.5/Fast-WAM, gated on all three accepted final checkpoints. VA/VMA are canceled andabc2/abc3 reassigned. RoboDojo production and evaluation durations are unmeasured.</desc>

  <defs>
    <pattern id="rm-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f4f8f5"/>
      <line x1="2" y1="0" x2="2" y2="10" stroke="#6fae87" stroke-width="2.5"/>
    </pattern>
    <marker id="rm-arrow" markerWidth="10" markerHeight="10" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>

  <g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

    <!-- Title -->
    <text x="40" y="32" font-size="22" font-weight="bold" fill="#1f2933">Remaining campaigns — parallel and sequential stages</text>
    <text x="40" y="56" font-size="15" fill="#5b6570">RoboTwin: September13 timing snapshot [INFERENCE]. RoboDojo: September14 status below, not time-scaled.</text>

    <!-- Legend -->
    <rect x="40" y="72" width="26" height="14" rx="3" fill="#2f7d4f"/>
    <text x="74" y="84" font-size="14" fill="#5b6570">running</text>
    <rect x="170" y="72" width="26" height="14" rx="3" fill="url(#rm-hatch)" stroke="#2f7d4f" stroke-width="1.5"/>
    <text x="204" y="84" font-size="14" fill="#5b6570">conditional</text>
    <text x="330" y="84" font-size="14" fill="#5b6570">→  open end (rate unverified)</text>

    <!-- Gridlines (every 6h; x = 310 + 16.0417 * t; axis 0-48h) -->
    <g stroke="#e3e8ec" stroke-width="1">
      <line x1="310"    y1="100" x2="310"    y2="560"/>
      <line x1="406.25" y1="100" x2="406.25" y2="560"/>
      <line x1="502.5"  y1="100" x2="502.5"  y2="560"/>
      <line x1="598.75" y1="100" x2="598.75" y2="560"/>
      <line x1="695"    y1="100" x2="695"    y2="560"/>
      <line x1="791.25" y1="100" x2="791.25" y2="560"/>
      <line x1="887.5"  y1="100" x2="887.5"  y2="560"/>
      <line x1="983.75" y1="100" x2="983.75" y2="560"/>
      <line x1="1080"   y1="100" x2="1080"   y2="560"/>
    </g>

    <!-- Deadline line: 26.5h = Sep 15 00:00 UTC -->
    <line x1="735.1" y1="100" x2="735.1" y2="560" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="742" y="112" font-size="13" fill="#c0392b">RoboTwin train deadline · Sep 15 00:00 UTC</text>

    <!-- ===== Campaign 1: RoboTwin scaling + exploration ===== -->
    <text x="40" y="130" font-size="17" font-weight="bold" fill="#1f2933">RoboTwin — remaining work (7-to-3 setup)</text>

    <!-- R1 -->
    <text x="40" y="166" font-size="15" fill="#1f2933"><tspan font-weight="bold">Scaling evals</tspan> · 600 trials · 5 GPUs</text>
    <rect x="310" y="150" width="128.3" height="26" rx="6" fill="#2f7d4f"/>
    <text x="452" y="168" font-size="14" fill="#5b6570">4–8 h</text>

    <!-- R2 -->
    <text x="40" y="210" font-size="15" fill="#1f2933"><tspan font-weight="bold">Exploration</tspan> · 575 trials · 8+8 GPUs</text>
    <rect x="310" y="194" width="64.2" height="26" rx="6" fill="url(#rm-hatch)" stroke="#2f7d4f" stroke-width="1.5"/>
    <text x="388" y="212" font-size="14" fill="#5b6570">1–4 h if recovery holds · reuses 7→3 ckpts</text>

    <!-- R3 -->
    <text x="40" y="254" font-size="15" fill="#1f2933"><tspan font-weight="bold">Fast-WAM train</tspan> · 5,000 updates · 4 GPUs</text>
    <rect x="342.1" y="238" width="288.75" height="26" rx="6" fill="url(#rm-hatch)" stroke="#2f7d4f" stroke-width="1.5"/>
    <text x="486.5" y="256" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">smoke repair, then 12–24 h</text>

    <!-- R4 -->
    <text x="40" y="298" font-size="15" fill="#1f2933"><tspan font-weight="bold">Fast-WAM evals</tspan> · 375 trials · 5 GPUs</text>
    <rect x="630.8" y="282" width="64.2" height="26" rx="6" fill="url(#rm-hatch)" stroke="#2f7d4f" stroke-width="1.5"/>
    <text x="709" y="300" font-size="14" fill="#5b6570">2–4 h after train</text>

    <!-- ===== Campaign 2: RoboDojo ===== -->
    <text x="40" y="346" font-size="17" font-weight="bold" fill="#1f2933">RoboDojo</text>

    <!-- D1 -->
    <text x="40" y="382" font-size="15" fill="#1f2933"><tspan font-weight="bold">Tracking</tspan> · complete</text>
    <rect x="310" y="366" width="770" height="26" rx="6" fill="#eef4ef"/>
    <text x="330" y="384" font-size="14" fill="#2f7d4f">875 / 875 verified; recovered outputs durably preserved</text>

    <!-- D2 -->
    <text x="40" y="426" font-size="15" fill="#1f2933"><tspan font-weight="bold">Data gate</tspan> · accepted</text>
    <rect x="310" y="410" width="770" height="26" rx="6" fill="#eef4ef"/>
    <text x="330" y="428" font-size="14" fill="#2f7d4f">35 real-loader positives + 35 genuine missing-text refusals</text>

    <!-- D3a -->
    <text x="40" y="470" font-size="15" fill="#1f2933"><tspan font-weight="bold">Fast-WAM</tspan> · abc6 × 8 GPUs</text>
    <rect x="310" y="454" width="705.8" height="26" rx="6" fill="#2f7d4f"/>
    <text x="330" y="472" font-size="14" font-weight="bold" fill="#ffffff">Live; target 5,000 updates; no verified steady-state rate →</text>
    <polygon points="1015.8,458 1036,467 1015.8,476" fill="#2f7d4f"/>

    <!-- D3b -->
    <text x="40" y="514" font-size="15" fill="#1f2933"><tspan font-weight="bold">MA / pi0.5</tspan> · 8 GPUs each</text>
    <rect x="310" y="498" width="770" height="26" rx="6" fill="#f6f8fa"/>
    <text x="330" y="516" font-size="14" fill="#5b6570">Admission → 5,000 updates on abc8 / abc5; durations unmeasured</text>

    <!-- D4 -->
    <text x="40" y="542" font-size="15" fill="#1f2933"><tspan font-weight="bold">Eval three</tspan> · 2,100 rollouts</text>
    <rect x="310" y="526" width="770" height="26" rx="6" fill="#f6f8fa"/>
    <text x="330" y="544" font-size="14" fill="#5b6570">Wait for all three accepted 5,000-update finals; 700 rollouts/model</text>

    <!-- Axis -->
    <line x1="310" y1="560" x2="1080" y2="560" stroke="#9aa4ae" stroke-width="1.5"/>
    <g stroke="#9aa4ae" stroke-width="1.5">
      <line x1="310"    y1="560" x2="310"    y2="566"/>
      <line x1="406.25" y1="560" x2="406.25" y2="566"/>
      <line x1="502.5"  y1="560" x2="502.5"  y2="566"/>
      <line x1="598.75" y1="560" x2="598.75" y2="566"/>
      <line x1="695"    y1="560" x2="695"    y2="566"/>
      <line x1="791.25" y1="560" x2="791.25" y2="566"/>
      <line x1="887.5"  y1="560" x2="887.5"  y2="566"/>
      <line x1="983.75" y1="560" x2="983.75" y2="566"/>
      <line x1="1080"   y1="560" x2="1080"   y2="566"/>
    </g>
    <g font-size="15" fill="#5b6570" text-anchor="middle">
      <text x="310"    y="584">0</text>
      <text x="406.25" y="584">6</text>
      <text x="502.5"  y="584">12</text>
      <text x="598.75" y="584">18</text>
      <text x="695"    y="584">24</text>
      <text x="791.25" y="584">30</text>
      <text x="887.5"  y="584">36</text>
      <text x="983.75" y="584">42</text>
      <text x="1080"   y="584">48</text>
    </g>
    <text x="695" y="608" font-size="14" font-style="italic" fill="#5b6570" text-anchor="middle">Historical RoboTwin axis: hours after September13, 21:30 UTC</text>

    <!-- Footnotes -->
    <text x="40" y="634" font-size="14" fill="#5b6570">RoboTwin timing basis is retained above. RoboDojo has no measured steady-state production or evaluation rate.</text>
    <text x="40" y="652" font-size="14" fill="#5b6570">RoboDojo: MA / pi0.5 / Fast-WAM only; VA/VMA canceled; abc2/abc3 reassigned and off-limits.</text>

  </g>
</svg>
