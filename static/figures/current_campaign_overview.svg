<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1120" height="578" viewBox="0 0 1120 578" role="img" aria-labelledby="ov-title ov-desc">
  <title id="ov-title">Pending-experiment progress: accepted evaluation trials and RoboDojo preparation pipeline</title>
  <desc id="ov-desc">Accepted evaluation progress: RoboTwin scaling 800 of 1575 trials (50.8 percent), exploratory MA/VA/VMA grid 25 of 600 (the accepted abc2 canary counts inside the grid; the abc2 grid controller is recovering, abc3 staged), RoboDojo 0 of 3500. Empty progress bars do not mean zero policy success. RoboDojo data preparation: VAE features for all 875 episodes complete; 220 motion tracks recovering on a newly authorized 24-GPU pool (abc5+abc7+abc8) with launches unverified; Fast-WAM training live on eight abc6 GPUs with unverified optimizer progress. Zero of five final checkpoints accepted; evaluation not started.</desc>

  <defs>
    <pattern id="ov-hatch-gray" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#eef1f4"/>
      <line x1="2" y1="0" x2="2" y2="10" stroke="#c6cdd4" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1120" height="578" fill="#ffffff"/>

  <g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

    <!-- Title -->
    <text x="40" y="34" font-size="22" font-weight="bold" fill="#1f2933">Pending-experiment progress — accepted evaluation trials</text>
    <text x="40" y="58" font-size="15" fill="#5b6570">Accepted trials only; claimed, queued, or running hardware is not a result.</text>
    <text x="40" y="78" font-size="15" fill="#5b6570">An empty bar means no accepted evaluation results — not a 0% policy-success rate.</text>

    <!-- Row 1: Scaling -->
    <text x="40" y="112" font-size="18" font-weight="bold" fill="#1f2933">Scaling · RoboTwin trials</text>
    <text x="1080" y="112" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="end">800 / 1,575 accepted · 50.8%</text>
    <rect x="40" y="124" width="1040" height="34" rx="8" fill="url(#ov-hatch-gray)" stroke="#d6dce2" stroke-width="1"/>
    <rect x="40" y="124" width="528" height="34" rx="8" fill="#2f7d4f"/>
    <text x="590" y="147" font-size="14" fill="#5b6570">17 of 36 cells</text>

    <!-- Row 2: Exploratory -->
    <text x="40" y="202" font-size="18" font-weight="bold" fill="#1f2933">Exploratory core · MA/VA/VMA</text>
    <text x="1080" y="202" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="end">25 / 600 accepted</text>
    <rect x="40" y="214" width="1040" height="34" rx="8" fill="url(#ov-hatch-gray)" stroke="#d6dce2" stroke-width="1"/>
    <rect x="40" y="214" width="43" height="34" rx="8" fill="#2f7d4f"/>
    <text x="100" y="237" font-size="14" fill="#5b6570">1 of 24 cells · abc2 grid recovering — abc3 staged</text>

    <!-- Row 3: RoboDojo -->
    <text x="40" y="292" font-size="18" font-weight="bold" fill="#1f2933">RoboDojo · evaluation trials</text>
    <text x="1080" y="292" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="end">0 / 3,500 accepted</text>
    <rect x="40" y="304" width="1040" height="34" rx="8" fill="url(#ov-hatch-gray)" stroke="#d6dce2" stroke-width="1"/>
    <text x="560" y="327" font-size="16" font-weight="bold" fill="#5b6570" text-anchor="middle">Evaluation waits for five accepted final checkpoints</text>

    <!-- Divider + preparation section -->
    <line x1="40" y1="362" x2="1080" y2="362" stroke="#dfe3e8" stroke-width="1"/>
    <text x="40" y="390" font-size="18" font-weight="bold" fill="#1f2933">RoboDojo: prepare data, then train and evaluate</text>
    <text x="1080" y="390" font-size="14" fill="#8a94a0" text-anchor="end">preparation counts are not evaluation progress</text>

    <!-- Pipeline boxes -->
    <rect x="40" y="404" width="233" height="88" rx="8" fill="#f6f8fa" stroke="#d6dce2" stroke-width="1"/>
    <text x="54" y="434" font-size="16" font-weight="bold" fill="#1f2933">VAE features</text>
    <text x="54" y="462" font-size="15" font-weight="bold" fill="#2f7d4f">875 / 875 complete</text>

    <rect x="309" y="404" width="233" height="88" rx="8" fill="#f6f8fa" stroke="#d6dce2" stroke-width="1"/>
    <text x="323" y="432" font-size="16" font-weight="bold" fill="#1f2933">Motion tracks</text>
    <text x="323" y="456" font-size="15" font-weight="bold" fill="#1f2933">655 / 875 terminal</text>
    <text x="323" y="477" font-size="14" fill="#c9862b">220 recovering · 24 GPUs</text>

    <rect x="578" y="404" width="233" height="88" rx="8" fill="#f6f8fa" stroke="#d6dce2" stroke-width="1"/>
    <text x="592" y="432" font-size="16" font-weight="bold" fill="#1f2933">Final checkpoints</text>
    <text x="592" y="456" font-size="15" font-weight="bold" fill="#5b6570">0 / 5 accepted</text>
    <text x="592" y="477" font-size="13" fill="#c9862b">Fast-WAM live (unverified)</text>

    <rect x="847" y="404" width="233" height="88" rx="8" fill="#fbfcfd" stroke="#d6dce2" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="861" y="434" font-size="16" font-weight="bold" fill="#1f2933">Evaluation</text>
    <text x="861" y="462" font-size="15" font-weight="bold" font-style="italic" fill="#5b6570">not started</text>

    <text x="291" y="454" font-size="20" fill="#8a94a0" text-anchor="middle">+</text>
    <text x="560" y="454" font-size="20" fill="#8a94a0" text-anchor="middle">→</text>
    <text x="829" y="454" font-size="20" fill="#8a94a0" text-anchor="middle">→</text>

    <!-- Blockers -->
    <text x="40" y="524" font-size="16" fill="#1f2933"><tspan font-weight="bold">Next:</tspan> verify RoboDojo tracker launches; repair the Fast-WAM smoke and abc2 grid controller; run remaining scaling cells.</text>

    <!-- Footnotes -->
    <text x="40" y="550" font-size="14" fill="#5b6570">Snapshot: September 13 · 21:30 UTC · tracking pool claimed 20:47–20:58 UTC (launches unverified).</text>
    <text x="40" y="570" font-size="14" fill="#5b6570">Exploration: the accepted abc2 canary counts inside the 600; Fast-WAM's 200 exploratory trials are separate.</text>

  </g>
</svg>
